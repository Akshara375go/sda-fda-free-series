<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SDA/FDA Free Test Series – Daily Practice | Karnataka e-Exam</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#1b2233;--muted:#5d667a;--accent:#1d4ed8;--accent2:#229ed9;--border:#e1e5ef;--red:#c8181e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1422;--card:#182036;--text:#e9ecf5;--muted:#a1a9bd;--accent:#7aa2ff;--accent2:#4fb8ea;--border:#27314d;--red:#ff6b70}}
:root[data-theme="dark"]{--bg:#0f1422;--card:#182036;--text:#e9ecf5;--muted:#a1a9bd;--accent:#7aa2ff;--accent2:#4fb8ea;--border:#27314d;--red:#ff6b70}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding:24px 16px 48px}
header{text-align:center;margin-bottom:18px}
header img{width:120px;height:120px;border-radius:50%;display:block;margin:0 auto 12px;box-shadow:0 2px 10px rgba(0,0,0,.18)}
header h1{font-size:1.45rem;margin:0 0 4px}
header p{margin:0;color:var(--muted);font-size:.95rem}
.tg{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--accent2);color:#fff;text-decoration:none;font-weight:600;padding:13px 16px;border-radius:12px;margin:16px 0 22px}
.tg:hover{opacity:.92}
.time{text-align:center;color:var(--muted);font-size:.9rem;margin:-10px 0 20px}
h2{font-size:1.1rem;margin:22px 0 12px;padding-left:10px;border-left:4px solid var(--accent)}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.day{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 8px;text-align:center;font-weight:700;color:var(--text);cursor:pointer;font-size:1rem;font-family:inherit}
.day:hover{border-color:var(--accent)}
.day small{display:block;font-weight:500;color:var(--muted);font-size:.75rem;margin-top:2px}
.day.latest{border-color:var(--red)}
.day.latest small{color:var(--red);font-weight:700}
.back{background:none;border:none;color:var(--accent);font-weight:600;font-size:1rem;cursor:pointer;padding:6px 0;margin-bottom:6px;font-family:inherit}
.item{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px;text-decoration:none;color:var(--text)}
.item:hover{border-color:var(--accent)}
.item b{display:block}
.item small{color:var(--muted)}
.go{color:var(--accent);font-weight:600;white-space:nowrap}
.item .info{flex:1;min-width:0}
.item ul{margin:6px 0 4px;padding-left:18px;color:var(--text);font-size:.92rem}
.item li{margin:1px 0}
.item .src{display:block;color:var(--muted);font-size:.8rem;margin-top:2px}
footer{text-align:center;color:var(--muted);font-size:.85rem;margin-top:32px}
footer a{color:var(--accent2)}
[hidden]{display:none!important}
</style>
</head>
